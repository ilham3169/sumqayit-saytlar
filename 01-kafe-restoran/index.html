<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xəzər Terrace — Restoran və Kafe, Sumqayıt</title>
<meta name="description" content="Xəzər Terrace — Sumqayıtda dənizkənarı restoran. Milli mətbəx, kabablar, çatdırılma və masa rezervi WhatsApp ilə.">
<meta property="og:title" content="Xəzər Terrace — Sumqayıt">
<meta property="og:description" content="Milli mətbəx, dəniz terrası, sürətli çatdırılma.">
<meta property="og:image" content="img/hero.jpg">
<meta name="theme-color" content="#10201b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2310201b'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='%23d39b55' font-family='Georgia'>X</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a href="#top" class="logo"><span class="logo-mark">X</span><span data-s="name"></span></a>
    <nav class="nav">
      <a href="#menu" data-t="nav_menu"></a>
      <a href="#about" data-t="nav_about"></a>
      <a href="#gallery" data-t="nav_gallery"></a>
      <a href="#book" data-t="nav_book"></a>
      <a href="#contact" data-t="nav_contact"></a>
    </nav>
    <div class="hdr-r">
      <div class="langs"><button data-lang="az">AZ</button><button data-lang="ru">RU</button></div>
      <button class="burger" data-nav-toggle aria-label="menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <img class="hero-bg" src="img/hero.jpg" alt="">
  <div class="wrap hero-in">
    <p class="kicker reveal" data-t="hero_kicker"></p>
    <h1 class="reveal d1" data-th="hero_title"></h1>
    <p class="lead reveal d2" data-t="hero_text"></p>
    <div class="btns reveal d3">
      <a href="#menu" class="btn btn-gold" data-t="hero_cta1"></a>
      <a href="#book" class="btn btn-ghost" data-t="hero_cta2"></a>
    </div>
    <div class="pill reveal d4" data-open></div>
  </div>
  <div class="hero-stats wrap">
    <div><b>4.8★</b><span data-t="stat_rating"></span></div>
    <div><b>30</b><span data-t="stat_delivery"></span></div>
    <div><b>120</b><span data-t="stat_seats"></span></div>
  </div>
</section>

<section class="feats wrap">
  <div class="feat reveal"><svg viewBox="0 0 24 24"><path d="M12 2c3 4 6 6 6 11a6 6 0 0 1-12 0c0-5 3-7 6-11z"/></svg><h3 data-t="f1_t"></h3><p data-t="f1_d"></p></div>
  <div class="feat reveal d1"><svg viewBox="0 0 24 24"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg><h3 data-t="f2_t"></h3><p data-t="f2_d"></p></div>
  <div class="feat reveal d2"><svg viewBox="0 0 24 24"><path d="M2 18c3 0 3-2 6-2s3 2 6 2 3-2 6-2M2 13c3 0 3-2 6-2s3 2 6 2 3-2 6-2M12 3v5"/></svg><h3 data-t="f3_t"></h3><p data-t="f3_d"></p></div>
  <div class="feat reveal d3"><svg viewBox="0 0 24 24"><path d="M4 21h16M6 21v-8h12v8M9 13V9M15 13V9M12 13V7M12 4v.5"/></svg><h3 data-t="f4_t"></h3><p data-t="f4_d"></p></div>
</section>

<section class="menu" id="menu">
  <div class="wrap">
    <div class="sec-head reveal">
      <p class="kicker" data-t="menu_kicker"></p>
      <h2 data-t="menu_title"></h2>
    </div>
    <div class="menu-tools reveal">
      <div class="tabs" id="tabs"></div>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" data-tp="search"></label>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="about wrap" id="about">
  <div class="about-img reveal"><img src="img/about.jpg" alt="" loading="lazy"><span class="badge-round">since<br><b>2016</b></span></div>
  <div class="about-txt">
    <p class="kicker reveal" data-t="about_kicker"></p>
    <h2 class="reveal d1" data-t="about_title"></h2>
    <p class="reveal d2" data-t="about_text"></p>
    <div class="nums reveal d3">
      <div><b>20+</b><span data-t="about_s1"></span></div>
      <div><b>60</b><span data-t="about_s2"></span></div>
      <div><b>50K</b><span data-t="about_s3"></span></div>
    </div>
  </div>
</section>

<section class="gallery" id="gallery">
  <div class="wrap">
    <div class="sec-head reveal"><p class="kicker" data-t="gallery_kicker"></p><h2 data-t="gallery_title"></h2></div>
    <div class="gal">
      <img class="reveal" src="img/g1.jpg" alt="" loading="lazy">
      <img class="reveal d1" src="img/g2.jpg" alt="" loading="lazy">
      <img class="reveal d2" src="img/g3.jpg" alt="" loading="lazy">
      <img class="reveal d3" src="img/g4.jpg" alt="" loading="lazy">
    </div>
  </div>
</section>

<section class="book" id="book">
  <div class="wrap book-in">
    <div class="book-txt">
      <p class="kicker reveal" data-t="book_kicker"></p>
      <h2 class="reveal d1" data-t="book_title"></h2>
      <p class="reveal d2" data-t="book_text"></p>
      <a class="tel reveal d3" data-href="tel"><span data-s="phone"></span></a>
    </div>
    <form class="book-form reveal d2" data-wa-form="book_msg">
      <label><span data-t="f_name"></span><input name="name" required data-label="f_name"></label>
      <label><span data-t="f_phone"></span><input name="phone" type="tel" required data-label="f_phone"></label>
      <label><span data-t="f_date"></span><input name="date" type="date" required data-label="f_date"></label>
      <label><span data-t="f_time"></span><input name="time" type="time" required data-label="f_time" value="19:00"></label>
      <label><span data-t="f_guests"></span>
        <select name="guests" data-label="f_guests"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10+</option></select></label>
      <label><span data-t="f_zone"></span>
        <select name="zone" data-label="f_zone"><option data-t="zone_hall"></option><option data-t="zone_terrace"></option><option data-t="zone_vip"></option></select></label>
      <label class="full"><span data-t="f_note"></span><textarea name="note" rows="2" data-label="f_note"></textarea></label>
      <button class="btn btn-gold full" type="submit" data-t="f_send"></button>
    </form>
  </div>
</section>

<section class="reviews wrap">
  <div class="sec-head reveal"><p class="kicker" data-t="rev_kicker"></p><h2 data-t="rev_title"></h2></div>
  <div class="revs" id="revs"></div>
</section>

<section class="contact" id="contact">
  <div class="wrap contact-in">
    <div class="contact-card reveal">
      <p class="kicker" data-t="contact_kicker"></p>
      <h2 data-t="contact_title"></h2>
      <p class="addr" data-s="address"></p>
      <p><a data-href="tel" class="big" data-s="phone"></a></p>
      <div class="soc">
        <a data-href="wa" data-wa-text="waHello">WhatsApp</a>
        <a data-href="insta">Instagram</a>
        <a data-href="map" data-t="route"></a>
      </div>
      <h3 data-t="hours_title"></h3>
      <ul data-hours></ul>
    </div>
    <div class="map reveal d1" data-map></div>
  </div>
</section>

<footer class="ftr">
  <div class="wrap ftr-in">
    <span>© <span data-year></span> <span data-s="name"></span>. <span data-t="rights"></span></span>
    <span class="pill" data-open></span>
  </div>
</footer>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
(function () {
  var S = Core.S, cat = 'all', q = '';
  var tabs = document.getElementById('tabs'), grid = document.getElementById('grid');
  var TAG = { hit: { az: 'Hit', ru: 'Хит' }, new: { az: 'Yeni', ru: 'Новинка' } };

  function renderTabs() {
    tabs.innerHTML = [{ id: 'all', name: Core.t('all') }].concat(S.categories).map(function (c) {
      return '<button class="' + (c.id === cat ? 'on' : '') + '" data-cat="' + c.id + '">' + Core.esc(Core.tr(c.name)) + '</button>';
    }).join('');
  }
  function renderGrid() {
    var list = S.items.filter(function (it) {
      var txt = (Core.tr(it.name) + ' ' + Core.tr(it.desc)).toLowerCase();
      return (cat === 'all' || it.cat === cat) && (!q || txt.indexOf(q) > -1);
    });
    grid.innerHTML = list.length ? list.map(function (it, i) {
      return '<article class="card reveal d' + (i % 4) + '">' +
        '<div class="card-img"><img src="' + it.img + '" alt="' + Core.esc(Core.tr(it.name)) + '" loading="lazy">' +
        (it.tag ? '<span class="tag tag-' + it.tag + '">' + Core.tr(TAG[it.tag]) + '</span>' : '') + '</div>' +
        '<div class="card-body"><h3>' + Core.esc(Core.tr(it.name)) + '</h3><p>' + Core.esc(Core.tr(it.desc)) + '</p>' +
        '<div class="card-foot"><b>' + Core.money(it.price) + '</b><button class="add" data-add="' + it.id + '" aria-label="add">+ <span>' + Core.t('add') + '</span></button></div></div></article>';
    }).join('') : '<p class="empty">' + Core.t('nothing') + '</p>';
    Core.observe(grid);
  }
  function renderReviews() {
    document.querySelector('.reviews').hidden = !S.reviews.length;
    document.getElementById('revs').innerHTML = S.reviews.map(function (r, i) {
      return '<blockquote class="rev reveal d' + i + '"><div class="stars">' + '★'.repeat(r.stars) + '</div><p>“' + Core.esc(Core.tr(r.text)) + '”</p><cite>' + Core.esc(r.name) + '</cite></blockquote>';
    }).join('');
  }
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]'); if (!b) return;
    cat = b.getAttribute('data-cat'); renderTabs(); renderGrid();
  });
  document.getElementById('q').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); renderGrid(); });
  var d = document.querySelector('input[type=date]');
  d.min = new Date().toISOString().slice(0, 10); d.value = d.min;
  Core.on('lang', function () { renderTabs(); renderGrid(); renderReviews(); });
})();
</script>
</body>
</html>
