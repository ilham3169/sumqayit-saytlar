<style>
:root{--bg:#0f0f14;--card:#17171f;--card2:#1e1e28;--ink:#f3f3f7;--muted:#9a9aae;--violet:#6d5efc;--violet2:#8b7fff;--green:#25d366;--line:rgba(255,255,255,.08);--c-accent:#6d5efc;--c-on-accent:#fff;--c-surface:#17171f;--c-text:#f3f3f7;--c-muted:#9a9aae;--c-line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0 0 .45em;line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,46px)}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
section{scroll-margin-top:70px}
.kicker{color:var(--violet2);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px}
.head{text-align:center;max-width:720px;margin:0 auto 44px}.head p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--violet);color:#fff;border:0;border-radius:14px;padding:15px 26px;font:700 15px 'Manrope',sans-serif;cursor:pointer;transition:.2s}
.btn:hover{background:var(--violet2);transform:translateY(-2px)}
.btn-wa{background:var(--green)}.btn-wa:hover{background:#1fbd5a}
.btn-ghost{background:transparent;border:1px solid var(--line)}.btn-ghost:hover{background:var(--card2)}
.hdr{position:sticky;top:0;z-index:50;background:rgba(15,15,20,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--violet),#c56bff);display:grid;place-items:center;font-style:normal}
.nav{display:flex;gap:26px;font-weight:600;font-size:15px;color:var(--muted)}.nav a:hover{color:var(--ink)}
.langs{display:flex;background:var(--card);border-radius:10px;padding:3px}
.langs button{border:0;background:none;color:var(--muted);font:700 12px 'Manrope';padding:6px 10px;border-radius:8px;cursor:pointer}
.langs button.active{background:var(--violet);color:#fff}
.hero{padding:80px 0 60px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:900px;height:900px;left:50%;top:-500px;transform:translateX(-50%);background:radial-gradient(circle,rgba(109,94,252,.35),transparent 60%);z-index:-1}
.pill{display:inline-block;border:1px solid var(--line);background:var(--card);padding:7px 16px;border-radius:30px;font-size:14px;font-weight:600;margin-bottom:22px}
.hero h1{font-size:clamp(38px,6.5vw,80px);max-width:1000px;margin:0 auto 20px}
.hero h1 span{background:linear-gradient(90deg,var(--violet2),#c56bff,#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:19px;color:var(--muted);max-width:680px;margin:0 auto 32px}
.hero .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.strip{display:flex;gap:14px;margin-top:60px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.strip-in{display:flex;gap:14px;animation:strip 60s linear infinite;width:max-content}
.strip img{width:300px;height:188px;object-fit:cover;object-position:top;border-radius:14px;border:1px solid var(--line)}
@keyframes strip{to{transform:translateX(-50%)}}
.why{padding:80px 0}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.why-grid div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.why-grid b{display:block;font-size:34px;font-weight:800;background:linear-gradient(90deg,var(--violet2),#c56bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.why-grid p{margin:4px 0 0;color:var(--muted);font-size:15px}
.demos{padding:80px 0}
.filter{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.filter button{border:1px solid var(--line);background:var(--card);color:var(--muted);font:700 14px 'Manrope';padding:9px 16px;border-radius:12px;cursor:pointer}
.filter button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.d-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.demo{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.3s;display:flex;flex-direction:column}
.demo:hover{transform:translateY(-6px);border-color:var(--violet)}
.shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
.shot img.d{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform 4s ease}
.demo:hover .shot img.d{transform:scale(1.04)}
.shot img.m{position:absolute;right:12px;bottom:-30px;width:24%;border-radius:12px;border:3px solid #000;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:.4s}
.demo:hover .shot img.m{bottom:12px}
.num{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px}
.d-b{padding:20px;display:flex;flex-direction:column;flex:1}
.d-b h3{font-size:20px;margin-bottom:2px}
.d-b .cat{color:var(--violet2);font-size:13px;font-weight:700;margin-bottom:10px}
.d-b ul{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px;flex:1;align-content:flex-start}
.d-b li{font-size:12px;font-weight:600;background:var(--card2);color:#cfcfe0;padding:4px 9px;border-radius:7px}
.d-b .btns{display:flex;gap:8px}
.d-b .btn{padding:11px 16px;font-size:14px;flex:1}
.leads{font-size:12px;color:var(--muted);margin-top:10px}
.packs{padding:90px 0}
.p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.pack{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column}
.pack.hot{border-color:var(--violet);background:linear-gradient(180deg,rgba(109,94,252,.16),var(--card) 50%);position:relative}
.pack.hot::before{content:attr(data-badge);position:absolute;top:-12px;left:32px;background:var(--violet);font-size:12px;font-weight:800;padding:4px 12px;border-radius:20px}
.pack h3{font-size:22px}.pack .price{font-size:48px;font-weight:800}.pack .price small{font-size:16px;color:var(--muted);font-weight:600}
.pack p{color:var(--muted);margin:0 0 16px}
.pack ul{list-style:none;padding:0;margin:0 0 24px;flex:1}
.pack li{padding:8px 0 8px 28px;position:relative;border-bottom:1px solid var(--line);font-size:15px}
.pack li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:800}
.steps{padding:40px 0 90px}
.s-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.s-grid div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.s-grid i{font-style:normal;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--violet);font-weight:800;margin-bottom:12px}
.s-grid h3{font-size:18px}.s-grid p{margin:0;color:var(--muted);font-size:15px}
.faq{padding:40px 0 90px}.faq-in{max-width:820px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 22px;margin-bottom:10px}
summary{cursor:pointer;padding:16px 0;font-weight:700;font-size:17px;list-style:none}summary::-webkit-details-marker{display:none}
summary::after{content:'+';float:right;color:var(--violet2);font-size:22px;line-height:1}
details[open] summary::after{content:'–'}
details p{color:var(--muted);margin:0 0 16px}
.cta{padding:0 0 100px}
.cta-in{background:linear-gradient(135deg,var(--violet),#a24dff);border-radius:30px;padding:60px 40px;text-align:center}
.cta-in p{opacity:.9;font-size:18px;max-width:600px;margin:0 auto 28px}
.cta-in .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta-in .btn-ghost{border-color:rgba(255,255,255,.4)}
.ftr{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px;text-align:center}
@media(max-width:960px){.nav{display:none}.d-grid,.p-grid{grid-template-columns:1fr 1fr}.why-grid,.s-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.d-grid,.p-grid{grid-template-columns:1fr}.why-grid,.s-grid{grid-template-columns:1fr}.strip img{width:220px;height:138px}.cta-in{padding:40px 22px}}
</style>
</head>

<script>

        return '<article class="demo reveal d' + (i % 3) + '"><a class="shot" href="' + d[0] + '/" target="_blank"><img class="d" src="_vitrin/thumbs/' + d[0] + '.jpg" alt="" loading="lazy"><img class="m" src="_vitrin/thumbs/' + d[0] + '-m.jpg" alt="" loading="lazy"><span class="num">#' + d[0].slice(0, 2) + '</span></a>' +
          '<div class="d-b"><h3>' + Core.esc(Core.tr(d[1])) + '</h3><span class="cat">AZ · RU · WhatsApp</span><ul>' + Core.tr(d[3]).map(function (x) { return '<li>' + Core.esc(x) + '</li>'; }).join('') + '</ul>' +

      }).join('');

        Core.tr(p.list).map(function (l) { return '<li>' + Core.esc(l) + '</li>'; }).join('') + '</ul><button class="btn ' + (p.hot ? '' : 'btn-ghost') + '" data-pack="' + i + '">' + Core.t('choose') + '</button></div>';

})();
