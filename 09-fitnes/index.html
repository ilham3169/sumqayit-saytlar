<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GÜC FITNESS — İdman zalı, Sumqayıt</title>
<meta name="description" content="Sumqayıtda fitness klub: trenajor zalı, boks, krossfit, yoqa, qadınlar zalı. Abunəlik qiymətləri, qrup dərsləri, pulsuz sınaq günü.">
<meta property="og:title" content="GÜC FITNESS — Sumqayıt">
<meta property="og:image" content="img/hero.jpg">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><path d='M22 40v20M32 32v36M68 32v36M78 40v20M32 50h36' stroke='%23c6ff3d' stroke-width='9' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a href="#top" class="logo"><svg viewBox="0 0 40 24"><path d="M4 8v8M10 4v16M30 4v16M36 8v8M10 12h20" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg><span data-s="name"></span></a>
    <nav class="nav"><a href="#classes" data-t="nav_classes"></a><a href="#prices" data-t="nav_prices"></a><a href="#schedule" data-t="nav_schedule"></a><a href="#trainers" data-t="nav_trainers"></a></nav>
    <div class="hdr-r">
      <div class="langs"><button data-lang="az">AZ</button><button data-lang="ru">RU</button></div>
      <a href="#trial" class="btn btn-sm" data-t="join"></a>
      <button class="burger" data-nav-toggle aria-label="menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <img src="img/hero.jpg" alt="" class="hero-bg">
  <div class="wrap hero-in">
    <p class="status reveal" data-open></p>
    <h1><span class="reveal d1" data-t="hero_l1"></span><span class="lime reveal d2" data-t="hero_l2"></span></h1>
    <p class="lead reveal d3" data-t="hero_text"></p>
    <div class="btns reveal d4"><a href="#trial" class="btn" data-t="hero_cta"></a><a href="#prices" class="btn btn-line" data-t="hero_cta2"></a></div>
  </div>
  <div class="facts wrap">
    <div><b>1200</b><span data-t="f1"></span></div>
    <div><b>12</b><span data-t="f2"></span></div>
    <div><b>40+</b><span data-t="f3"></span></div>
    <div><b>3K+</b><span data-t="f4"></span></div>
  </div>
</section>

<div class="marquee"><div class="mq-in">GYM ✦ BOX ✦ CROSSFIT ✦ YOGA ✦ PILATES ✦ HIIT ✦ CARDIO ✦ GYM ✦ BOX ✦ CROSSFIT ✦ YOGA ✦ PILATES ✦ HIIT ✦ CARDIO ✦</div></div>

<section class="classes" id="classes">
  <div class="wrap">
    <h2 class="title reveal" data-t="classes_title"></h2>
    <div class="cl-grid" id="cl-grid"></div>
  </div>
</section>

<section class="prices" id="prices">
  <div class="wrap">
    <div class="title-row reveal">
      <h2 class="title" data-t="prices_title"></h2>
      <div class="period" id="period"><button data-p="0" data-t="p1m"></button><button data-p="1" data-t="p3m"></button><button data-p="2" data-t="p12m"></button></div>
    </div>
    <div class="plans" id="plans"></div>
  </div>
</section>

<section class="bmi">
  <div class="wrap bmi-in">
    <div class="reveal"><h2 data-t="bmi_title"></h2><p data-t="bmi_text"></p></div>
    <div class="bmi-box reveal d1">
      <label><span data-t="height"></span><input type="range" min="140" max="210" value="175" id="bh"><b id="bhv"></b></label>
      <label><span data-t="weight"></span><input type="range" min="40" max="160" value="78" id="bw"><b id="bwv"></b></label>
      <div class="bmi-res"><div class="bmi-num" id="bnum"></div><div><p id="btxt"></p><div class="scale"><i id="bptr"></i></div></div></div>
      <button class="btn" id="bask" data-t="bmi_ask"></button>
    </div>
  </div>
</section>

<section class="schedule" id="schedule">
  <div class="wrap">
    <h2 class="title reveal" data-t="schedule_title"></h2>
    <div class="days reveal" id="days"></div>
    <div class="sch-list" id="sch"></div>
  </div>
</section>

<section class="trainers" id="trainers">
  <div class="wrap">
    <h2 class="title reveal" data-t="trainers_title"></h2>
    <div class="tr-grid" id="tr-grid"></div>
  </div>
</section>

<section class="trial" id="trial">
  <div class="wrap trial-in">
    <div class="reveal"><h2 data-t="trial_title"></h2><p data-t="trial_text"></p></div>
    <form class="form reveal d1" data-wa-form="trial_msg">
      <input name="name" required data-label="f_name" data-tp="f_name">
      <input name="phone" type="tel" required data-label="f_phone" data-tp="f_phone">
      <div class="goals"><label><input type="radio" name="goal" checked data-label="f_goal"><span data-t="g1"></span></label><label><input type="radio" name="goal" data-label="f_goal"><span data-t="g2"></span></label><label><input type="radio" name="goal" data-label="f_goal"><span data-t="g3"></span></label><label><input type="radio" name="goal" data-label="f_goal"><span data-t="g4"></span></label></div>
      <button class="btn" type="submit" data-t="f_send"></button>
    </form>
  </div>
</section>

<section class="contact">
  <div class="wrap contact-in">
    <div class="reveal">
      <h2 data-t="contact_title"></h2>
      <p data-s="address"></p>
      <a data-href="tel" class="tel" data-s="phone"></a>
      <div class="links"><a data-href="wa" data-wa-text="waHello">WhatsApp</a><a data-href="insta">Instagram</a><a data-href="map" data-t="route"></a></div>
      <h3 data-t="hours_title"></h3>
      <ul data-hours></ul>
    </div>
    <div class="map reveal d1" data-map></div>
  </div>
</section>

<footer class="ftr"><div class="wrap">© <span data-year></span> <span data-s="name"></span> · <span data-t="rights"></span></div></footer>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
(function () {
  var S = Core.S, $ = Core.$, period = 0, day = Math.min(Math.max(new Date().getDay(), 1), 6);
  var MONTHS = [1, 3, 12], DAYS = { az: ['', 'B.e.', 'Ç.a.', 'Çər.', 'C.a.', 'Cümə', 'Şənbə'], ru: ['', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'] };
  function render() {
    $('#cl-grid').innerHTML = S.classes.map(function (c, i) {
      return '<article class="cl reveal d' + (i % 3) + '"><img src="' + c.img + '" alt="" loading="lazy"><div><h3>' + Core.esc(Core.tr(c.name)) + '</h3><p>' + Core.esc(Core.tr(c.desc)) + '</p></div><span class="num">0' + (i + 1) + '</span></article>';
    }).join('');
    $('#tr-grid').innerHTML = S.trainers.map(function (t, i) {
      return '<article class="tr reveal d' + i + '"><img src="' + t.img + '" alt="' + t.name + '" loading="lazy"><div><h3>' + t.name + '</h3><p>' + Core.esc(Core.tr(t.role)) + '</p></div></article>';
    }).join('');
    renderPlans(); renderSchedule(); bmi();
  }
  function renderPlans() {
    Core.$$('#period button').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-p') === period); });
    $('#plans').innerHTML = S.plans.map(function (p, i) {
      var total = p.prices[period], per = Math.round(total / MONTHS[period]), save = p.prices[0] * MONTHS[period] - total;
      return '<div class="plan reveal d' + i + (p.hot ? ' hot' : '') + '">' + (p.hot ? '<span class="pop">' + Core.t('popular') + '</span>' : '') + '<h3>' + Core.esc(Core.tr(p.name)) + '</h3>' +
        '<div class="pp"><b>' + Core.money(per) + '</b><span>' + Core.t('per_month') + '</span></div><p class="tot">' + Core.money(total) + (save > 0 ? ' · <em>' + Core.money(save) + ' ' + Core.t('save') + '</em>' : '') + '</p><ul>' +
        Core.tr(p.list).map(function (l) { return '<li>' + Core.esc(l) + '</li>'; }).join('') + '</ul><button class="btn ' + (p.hot ? '' : 'btn-line') + '" data-plan="' + i + '">' + Core.t('choose') + '</button></div>';
    }).join('');
    Core.observe();
  }
  function renderSchedule() {
    var d = Core.tr(DAYS);
    $('#days').innerHTML = [1, 2, 3, 4, 5, 6].map(function (i) { return '<button class="' + (i === day ? 'on' : '') + '" data-day="' + i + '">' + d[i] + '</button>'; }).join('');
    $('#sch').innerHTML = (S.schedule[day] || []).map(function (r) { return '<div class="sch-row"><b>' + r[0] + '</b><h3>' + Core.esc(r[1]) + '</h3><span>' + Core.esc(r[2]) + '</span></div>'; }).join('');
  }
  var lastBmi = 0;
  function bmi() {
    var h = +$('#bh').value, w = +$('#bw').value, v = w / Math.pow(h / 100, 2);
    lastBmi = v;
    $('#bhv').textContent = h; $('#bwv').textContent = w; $('#bnum').textContent = v.toFixed(1);
    var k = v < 18.5 ? 'bmi_low' : v < 25 ? 'bmi_ok' : v < 30 ? 'bmi_over' : 'bmi_ob';
    $('#btxt').textContent = Core.t(k);
    $('#bptr').style.left = Math.min(100, Math.max(0, (v - 15) / 25 * 100)) + '%';
  }
  $('#bh').addEventListener('input', bmi); $('#bw').addEventListener('input', bmi);
  $('#bask').addEventListener('click', function () { Core.openWa(Core.t('bmi_msg') + lastBmi.toFixed(1) + ' (' + $('#bh').value + ' sm, ' + $('#bw').value + ' kq) — ' + $('#btxt').textContent); });
  document.addEventListener('click', function (e) {
    var p = e.target.closest('[data-p]'); if (p) { period = +p.getAttribute('data-p'); renderPlans(); }
    var d = e.target.closest('[data-day]'); if (d) { day = +d.getAttribute('data-day'); renderSchedule(); }
    var pl = e.target.closest('[data-plan]');
    if (pl) { var x = S.plans[+pl.getAttribute('data-plan')]; Core.openWa(Core.t('plan_msg') + Core.tr(x.name) + ' · ' + Core.t(['p1m', 'p3m', 'p12m'][period]) + ' · ' + Core.money(x.prices[period])); }
  });
  Core.on('lang', render);
})();
</script>
</body>
</html>
