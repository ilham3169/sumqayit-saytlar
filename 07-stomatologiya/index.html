<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ağ Gülüş — Stomatoloji klinika, Sumqayıt</title>
<meta name="description" content="Sumqayıtda stomatoloji klinika: implant, breket, ağartma, karies müalicəsi, uşaq stomatologiyası. Pulsuz müayinə, taksit, onlayn qəbul.">
<meta property="og:title" content="Ağ Gülüş — Sumqayıt">
<meta property="og:image" content="img/hero.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230ea5a0'/><path d='M30 28c8-6 14-2 20 0 6-2 12-6 20 0 6 6 2 18 0 26-2 10-4 22-8 22s-5-16-12-16-8 16-12 16-6-12-8-22c-2-8-6-20 0-26z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a href="#top" class="logo"><svg viewBox="0 0 40 40"><path d="M10 9c5-4 8-1 10 0 3-1 6-4 10 0 4 4 1 11 0 16-1 6-2 12-4 12s-3-9-6-9-4 9-6 9-3-6-4-12c-1-5-4-12 0-16z" fill="currentColor"/></svg><span data-s="name"></span><small>dental clinic</small></a>
    <nav class="nav"><a href="#services" data-t="nav_services"></a><a href="#prices" data-t="nav_prices"></a><a href="#doctors" data-t="nav_doctors"></a><a href="#contact" data-t="nav_contact"></a></nav>
    <div class="hdr-r">
      <div class="langs"><button data-lang="az">AZ</button><button data-lang="ru">RU</button></div>
      <a href="#book" class="btn btn-sm" data-t="appoint"></a>
      <button class="burger" data-nav-toggle aria-label="menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <div class="wrap hero-in">
    <div>
      <span class="badge reveal">✓ <span data-t="hero_badge"></span></span>
      <h1 class="reveal d1" data-th="hero_title"></h1>
      <p class="lead reveal d2" data-t="hero_text"></p>
      <div class="btns reveal d3"><a href="#book" class="btn" data-t="appoint"></a><a href="#prices" class="btn btn-ghost" data-t="hero_cta2"></a></div>
      <div class="rating reveal d4">
        <div><b>18</b><span data-t="r1"></span></div>
        <div><b>9 000+</b><span data-t="r2"></span></div>
        <div><b>4.9 ★</b><span data-t="r3"></span></div>
      </div>
    </div>
    <div class="hero-pic reveal d2">
      <img src="img/hero.jpg" alt="">
      <div class="card-float cf1"><span data-open></span></div>
      <div class="card-float cf2"><img src="img/doc1.jpg" alt=""><div><b>Dr. Elçin</b><small data-t="r1"></small></div></div>
    </div>
  </div>
</section>

<section class="services" id="services">
  <div class="wrap">
    <div class="head reveal"><p class="kicker" data-t="svc_kicker"></p><h2 data-t="svc_title"></h2></div>
    <div class="svc-grid" id="svc"></div>
    <div class="taksit reveal"><div class="tk-ico">%</div><div><h3 data-t="taksit_t"></h3><p data-t="taksit_d"></p></div><a href="#book" class="btn btn-white" data-t="appoint"></a></div>
  </div>
</section>

<section class="prices" id="prices">
  <div class="wrap prices-in">
    <div class="reveal">
      <p class="kicker" data-t="prices_kicker"></p>
      <h2 data-t="prices_title"></h2>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" data-tp="search"></label>
      <img src="img/about.jpg" alt="" class="prices-img" loading="lazy">
    </div>
    <div class="price-table reveal d1" id="ptable"></div>
  </div>
</section>

<section class="steps">
  <div class="wrap">
    <div class="head reveal"><p class="kicker" data-t="steps_kicker"></p></div>
    <div class="steps-row">
      <div class="reveal"><i>1</i><h3 data-t="st1"></h3><p data-t="st1d"></p></div>
      <div class="reveal d1"><i>2</i><h3 data-t="st2"></h3><p data-t="st2d"></p></div>
      <div class="reveal d2"><i>3</i><h3 data-t="st3"></h3><p data-t="st3d"></p></div>
      <div class="reveal d3"><i>4</i><h3 data-t="st4"></h3><p data-t="st4d"></p></div>
    </div>
  </div>
</section>

<section class="doctors" id="doctors">
  <div class="wrap">
    <div class="head reveal"><p class="kicker" data-t="doc_kicker"></p><h2 data-t="doc_title"></h2></div>
    <div class="doc-grid" id="docs"></div>
  </div>
</section>

<section class="reviews">
  <div class="wrap">
    <div class="head reveal"><p class="kicker" data-t="rev_kicker"></p></div>
    <div class="rev-grid" id="revs"></div>
  </div>
</section>

<section class="book" id="book">
  <div class="wrap book-in">
    <div class="reveal">
      <p class="kicker" data-t="book_kicker"></p>
      <h2 data-t="book_title"></h2>
      <p data-t="book_text"></p>
      <a data-href="tel" class="tel" data-s="phone"></a>
    </div>
    <form class="form reveal d1" data-wa-form="book_msg">
      <label><span data-t="f_name"></span><input name="name" required data-label="f_name"></label>
      <label><span data-t="f_phone"></span><input name="phone" type="tel" required data-label="f_phone"></label>
      <label><span data-t="f_service"></span><select name="service" id="f-svc" data-label="f_service"></select></label>
      <label><span data-t="f_doctor"></span><select name="doctor" id="f-doc" data-label="f_doctor"></select></label>
      <label><span data-t="f_date"></span><input name="date" type="date" id="f-date" data-label="f_date"></label>
      <div><span class="lbl" data-t="f_pain"></span><div class="radio"><label><input type="radio" name="pain" data-label="f_pain"><span data-t="yes"></span></label><label><input type="radio" name="pain" checked data-label="f_pain"><span data-t="no"></span></label></div></div>
      <button class="btn full" type="submit" data-t="f_send"></button>
    </form>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap contact-in">
    <div class="reveal">
      <h2 data-t="contact_title"></h2>
      <p data-s="address"></p>
      <a data-href="tel" class="tel" data-s="phone"></a>
      <div class="links"><a data-href="wa" data-wa-text="waHello">WhatsApp</a><a data-href="insta">Instagram</a><a data-href="map" data-t="route"></a></div>
      <h3 data-t="hours_title"></h3>
      <ul data-hours></ul>
    </div>
    <div class="map reveal d1" data-map></div>
  </div>
</section>

<footer class="ftr"><div class="wrap">© <span data-year></span> <span data-s="name"></span> · <span data-t="rights"></span></div></footer>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
(function () {
  var S = Core.S, $ = Core.$, q = '';
  function from(p) { var m = Core.money(p); return Core.lang === 'ru' ? Core.t('from') + m : m + Core.t('from'); }
  function render() {
    $('#svc').innerHTML = S.services.map(function (s, i) {
      return '<article class="svc reveal d' + (i % 3) + '"><div class="svc-img"><img src="' + s.img + '" alt="" loading="lazy"></div><div class="svc-b"><h3>' + Core.esc(Core.tr(s.name)) + '</h3><p>' + Core.esc(Core.tr(s.desc)) + '</p><div class="svc-f"><b>' + from(s.price) + '</b><a href="#book" data-svc="' + i + '">' + Core.t('appoint') + ' →</a></div></div></article>';
    }).join('');
    $('#docs').innerHTML = S.doctors.map(function (d, i) {
      return '<article class="doc reveal d' + i + '"><img src="' + d.img + '" alt="' + d.name + '" loading="lazy"><div class="doc-b"><h3>' + d.name + '</h3><p>' + Core.esc(Core.tr(d.role)) + '</p><small>' + d.years + ' ' + Core.t('exp') + '</small><a href="#book" data-doc="' + i + '">' + Core.t('book_with') + '</a></div></article>';
    }).join('');
    document.querySelector('.reviews').hidden = !S.reviews.length;
    $('#revs').innerHTML = S.reviews.map(function (r, i) {
      return '<blockquote class="reveal d' + i + '"><div class="stars">★★★★★</div><p>' + Core.esc(Core.tr(r.text)) + '</p><cite>' + Core.esc(r.name) + '</cite></blockquote>';
    }).join('');
    $('#f-svc').innerHTML = S.services.map(function (s) { return '<option>' + Core.esc(Core.tr(s.name)) + '</option>'; }).join('');
    $('#f-doc').innerHTML = '<option>' + Core.t('any') + '</option>' + S.doctors.map(function (d) { return '<option>' + d.name + '</option>'; }).join('');
    renderPrices();
  }
  function renderPrices() {
    $('#ptable').innerHTML = S.prices.map(function (g) {
      var rows = g.items.filter(function (r) { return !q || Core.tr(r[0]).toLowerCase().indexOf(q) > -1; });
      if (!rows.length) return '';
      return '<div class="pg"><h3>' + Core.esc(Core.tr(g.g)) + '</h3>' + rows.map(function (r) {
        return '<div class="pr"><span>' + Core.esc(Core.tr(r[0])) + '</span><b>' + (r[1] ? Core.money(r[1]) : (Core.lang === 'ru' ? 'Бесплатно' : 'Pulsuz')) + '</b></div>';
      }).join('') + '</div>';
    }).join('') || '<p class="pr">—</p>';
  }
  $('#q').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); renderPrices(); });
  document.addEventListener('click', function (e) {
    var s = e.target.closest('[data-svc]'); if (s) $('#f-svc').selectedIndex = +s.getAttribute('data-svc');
    var d = e.target.closest('[data-doc]'); if (d) $('#f-doc').selectedIndex = +d.getAttribute('data-doc') + 1;
  });
  var d = $('#f-date'), n = new Date(); d.min = d.value = n.toISOString().slice(0, 10);
  Core.on('lang', render);
})();
</script>
</body>
</html>
