<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gülüm Gül Salonu — Gül çatdırılması, Sumqayıt</title>
<meta name="description" content="Sumqayıtda gül çatdırılması: qızılgül, pion, lalə buketləri, gül qutuları. 60 dəqiqəyə çatdırılma, WhatsApp ilə sifariş.">
<meta property="og:title" content="Gülüm Gül Salonu — Sumqayıt">
<meta property="og:image" content="img/hero.jpg">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a href="#top" class="logo"><svg viewBox="0 0 40 40"><path d="M20 36V18M20 24c-6 0-9-4-9-8 5 0 9 3 9 8zM20 22c5 0 8-3 8-7-5 0-8 3-8 7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 10c0-4 3-6 6-8 3 2 6 4 6 8a6 6 0 0 1-12 0z" fill="currentColor"/></svg><span data-s="name"></span></a>
    <nav class="nav">
      <a href="#shop" data-t="nav_shop"></a><a href="#how" data-t="nav_how"></a><a href="#about" data-t="nav_about"></a><a href="#contact" data-t="nav_contact"></a>
    </nav>
    <div class="hdr-r">
      <div class="langs"><button data-lang="az">AZ</button><button data-lang="ru">RU</button></div>
      <button class="cart-btn" data-open-cart aria-label="cart"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg><b data-cart-count>0</b></button>
      <button class="burger" data-nav-toggle aria-label="menu"><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <div class="wrap hero-in">
    <div class="hero-txt">
      <p class="kicker reveal" data-t="hero_kicker"></p>
      <h1 class="reveal d1" data-th="hero_title"></h1>
      <p class="lead reveal d2" data-t="hero_text"></p>
      <div class="reveal d3 hero-act"><a href="#shop" class="btn" data-t="hero_cta"></a><span class="open" data-open></span></div>
    </div>
    <div class="hero-img reveal d1">
      <img src="img/hero.jpg" alt="">
      <div class="float-card"><img src="img/b-peonies.jpg" alt=""><div><b>Pion · M</b><span>95 ₼</span></div></div>
    </div>
  </div>
  <div class="wrap benefits">
    <div><i>🚚</i><span data-t="b1"></span></div>
    <div><i>💌</i><span data-t="b2"></span></div>
    <div><i>📸</i><span data-t="b3"></span></div>
    <div><i>🌿</i><span data-t="b4"></span></div>
  </div>
</section>

<section class="shop" id="shop">
  <div class="wrap">
    <div class="head reveal"><p class="kicker" data-t="shop_kicker"></p><h2 data-t="shop_title"></h2></div>
    <div class="occ reveal"><span data-t="occ_kicker"></span><div id="occ"></div></div>
    <div class="filters reveal" id="filters"></div>
    <div class="products" id="products"></div>
    <div class="custom reveal">
      <div><h3 data-t="custom_title"></h3><p data-t="custom_text"></p></div>
      <a class="btn btn-light" data-href="wa" data-wa-text="custom_wa" data-t="custom_btn"></a>
    </div>
  </div>
</section>

<section class="how" id="how">
  <div class="wrap">
    <div class="head reveal"><p class="kicker" data-t="how_kicker"></p><h2 data-t="how_title"></h2></div>
    <div class="steps">
      <div class="reveal"><b>1</b><h3 data-t="h1t"></h3><p data-t="h1d"></p></div>
      <div class="reveal d1"><b>2</b><h3 data-t="h2t"></h3><p data-t="h2d"></p></div>
      <div class="reveal d2"><b>3</b><h3 data-t="h3t"></h3><p data-t="h3d"></p></div>
      <div class="reveal d3"><b>4</b><h3 data-t="h4t"></h3><p data-t="h4d"></p></div>
    </div>
  </div>
</section>

<section class="about wrap" id="about">
  <img class="reveal" src="img/about.jpg" alt="" loading="lazy">
  <div class="reveal d1">
    <p class="kicker" data-t="about_kicker"></p>
    <h2 data-t="about_title"></h2>
    <p data-t="about_text"></p>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap contact-in">
    <div class="reveal">
      <h2 data-t="contact_title"></h2>
      <p data-s="address"></p>
      <a class="tel" data-href="tel" data-s="phone"></a>
      <div class="links"><a data-href="wa" data-wa-text="waHello">WhatsApp</a><a data-href="insta">Instagram</a><a data-href="map" data-t="route"></a></div>
      <h3 data-t="hours_title"></h3>
      <ul data-hours></ul>
    </div>
    <div class="map reveal d1" data-map></div>
  </div>
</section>

<footer class="ftr"><div class="wrap">© <span data-year></span> <span data-s="name"></span> · <span data-t="rights"></span></div></footer>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
(function () {
  var S = Core.S, $ = Core.$, cat = 'all';
  function fromPrice(it) { var m = Core.money(it.sizes[0].p); return Core.lang === 'ru' ? Core.t('from') + m : m + Core.t('from'); }
  function sizeLabel(it, s) { return s.n + (it.unit ? ' ' + Core.tr(it.unit) : ''); }
  function render() {
    $('#occ').innerHTML = S.occasions.map(function (o) { return '<span>' + Core.esc(Core.tr(o)) + '</span>'; }).join('');
    $('#filters').innerHTML = [{ id: 'all', name: { az: Core.t('all'), ru: Core.t('all') } }].concat(S.categories).map(function (c) {
      return '<button class="' + (c.id === cat ? 'on' : '') + '" data-cat="' + c.id + '">' + Core.esc(Core.tr(c.name)) + '</button>';
    }).join('');
    $('#products').innerHTML = S.items.filter(function (it) { return cat === 'all' || it.cat === cat; }).map(function (it, i) {
      return '<article class="p reveal d' + (i % 4) + '"><button class="p-img" data-view="' + it.id + '"><img src="' + it.img + '" alt="' + Core.esc(Core.tr(it.name)) + '" loading="lazy">' + (it.hit ? '<span class="hit">♥ Top</span>' : '') + '</button>' +
        '<h3>' + Core.esc(Core.tr(it.name)) + '</h3><div class="p-foot"><span>' + fromPrice(it) + '</span><button data-view="' + it.id + '">' + Core.t('choose') + '</button></div></article>';
    }).join('');
    Core.observe($('#products'));
  }
  function view(id) {
    var it = S.items.find(function (x) { return x.id === id; }), sel = 0;
    var m = Core.modal('<div class="pv"><img src="' + it.img + '" alt=""><div class="pv-body"><h3>' + Core.esc(Core.tr(it.name)) + '</h3><p class="pv-price"></p><p class="lbl">' + Core.t('size') + '</p><div class="sizes">' +
      it.sizes.map(function (s, i) { return '<button data-i="' + i + '" class="' + (i === 0 ? 'on' : '') + '">' + Core.esc(sizeLabel(it, s)) + '</button>'; }).join('') +
      '</div><button class="btn pv-add">' + Core.t('add') + '</button></div></div>');
    function upd() { m.el.querySelector('.pv-price').textContent = Core.money(it.sizes[sel].p); }
    upd();
    m.el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-i]');
      if (b) { sel = +b.getAttribute('data-i'); m.el.querySelectorAll('.sizes button').forEach(function (x) { x.classList.toggle('on', x === b); }); upd(); }
      if (e.target.closest('.pv-add')) { var s = it.sizes[sel]; Core.cart.add(it.id, sizeLabel(it, s), s.p); m.close(); }
    });
  }
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-cat]'); if (c) { cat = c.getAttribute('data-cat'); render(); }
    var v = e.target.closest('[data-view]'); if (v) view(v.getAttribute('data-view'));
  });
  Core.on('lang', render);
})();
</script>
</body>
</html>
